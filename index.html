<style>
/* Layout: sticky top bar + tab strip; appointment queue as stacked cards; full-screen overlays for Rx editor and print preview */
:root{
  --bg:#eef2f4; --surface:#ffffff; --ink:#14232b; --muted:#5c6f79; --line:#d5dee3;
  --accent:#0b6e6a; --accent-ink:#ffffff; --accent-soft:#d9efed;
  --go:#1c7c3a; --warn:#c2570c; --bad:#b42318; --info:#1d5fa8; --black:#111c22;
  --font:'Hind Siliguri','Noto Sans Bengali','Kalpurush','SolaimanLipi',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a1f; --surface:#17262d; --ink:#e6eef1; --muted:#93a8b2; --line:#2b3f48;
  --accent:#3fbdb5; --accent-ink:#06201f; --accent-soft:#16383a;
  --go:#4cc26e; --warn:#f0924a; --bad:#f2786b; --info:#6aa8ec; --black:#e6eef1;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a1f; --surface:#17262d; --ink:#e6eef1; --muted:#93a8b2; --line:#2b3f48;
  --accent:#3fbdb5; --accent-ink:#06201f; --accent-soft:#16383a;
  --go:#4cc26e; --warn:#f0924a; --bad:#f2786b; --info:#6aa8ec; --black:#e6eef1;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wrap{max-width:900px;margin:0 auto}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 0;margin-bottom:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;color:var(--accent)}
.brand small{color:var(--muted)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:8px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs button.on{color:var(--accent);border-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:6px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.go{background:var(--go);border-color:var(--go);color:#fff}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.dark{background:var(--black);border-color:var(--black);color:var(--bg)}
.btn.info{background:var(--info);border-color:var(--info);color:#fff}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.banner{background:var(--warn);color:#fff;padding:8px 12px;border-radius:8px;font-weight:600;margin:8px 0}
.appt{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--info);border-radius:8px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:40px 1fr auto;gap:4px 10px}
.appt.s-in{border-left-color:var(--go);background:var(--accent-soft)}
.appt.s-done{border-left-color:var(--muted);opacity:.8}
.appt.s-cancel,.appt.s-absent{border-left-color:var(--bad);opacity:.7}
.sl{font-size:22px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;text-align:center}
.pn{font-weight:700;font-size:16px;word-break:break-word}
.meta{color:var(--muted);font-size:13px;word-break:break-word}
.appt .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.appt select{width:auto;padding:5px 8px;font-size:13px}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;margin-left:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:15px}
.muted{color:var(--muted)}
label.f{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px;font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}
/* overlays */
#modal{position:fixed;inset:0;z-index:50;background:rgba(5,15,20,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:max(10px,env(safe-area-inset-top,0px)) 10px 20px}
#modal.open{display:flex}
.sheet{background:var(--surface);border-radius:10px;width:100%;max-width:560px;padding:14px;margin-top:2vh}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:17px}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.new{border-style:dashed;color:var(--accent);font-weight:600}
.lbl{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);margin:12px 0 6px;text-transform:uppercase}
.selrow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
.selrow .st{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--bg)}
.del{background:var(--bad);color:#fff;border:0;border-radius:6px;padding:8px 10px}
#view{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;display:none;padding:0 max(12px,env(safe-area-inset-left,0px)) 60px}
#view.open{display:block}
.vbar{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:10px}
.ptbox{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sec{border-top:1px solid var(--line);padding:8px 0}
.sec h4{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.sec h4 button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:50%;width:24px;height:24px;line-height:1;font-size:17px;padding:0}
.sec ul{margin:4px 0 0;padding-left:20px}
.sec li small{color:var(--muted)}
.rxline{display:grid;grid-template-columns:22px 1fr auto;gap:4px 8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.rxline .sub{color:var(--muted);font-size:13px}
.icons{display:flex;gap:4px}
.icons button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:13px}
.dosegrid{display:flex;gap:6px;flex-wrap:wrap}
.paper-wrap{overflow:hidden;background:#cfd8dc;padding:12px;border-radius:8px;display:flex;justify-content:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--black);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:99;font-weight:600}

/* ---------- prescription paper (screen + print + pdf) ---------- */
.rx{--rx-ink:#000;--rx-accent:#000;--rx-soft:#fff;--rx-line:#000;background:#fff;color:#000;font-family:var(--font);font-size:12px;line-height:1.4;padding:10px;width:302px;flex:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rx,.rx *{box-sizing:border-box}
.rx.p58{width:210px;font-size:10.5px}
.rx .rh{text-align:center;padding-bottom:6px;border-bottom:2px solid #000}
.rx .rh-r{display:none}
.rx .dn{font-size:1.35em;font-weight:700;line-height:1.2}
.rx .dg,.rx .sp,.rx .rg{font-size:.92em}
.rx .pt{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;padding:6px 0;border-bottom:1px solid #000}
.rx .pt div{min-width:0}
.rx .pt span{display:block;font-size:.78em;text-transform:uppercase;letter-spacing:.05em;opacity:.7}
.rx .pt .w2{grid-column:1/-1}
.rx h5{margin:8px 0 2px;font-size:1em;font-weight:700;border-bottom:1px dotted #000;padding-bottom:1px}
.rx ul{margin:2px 0 0;padding-left:15px}
.rx li{margin-bottom:1px}
.rx li i{opacity:.85;font-style:normal}
.rx .rxh{font-size:2em;font-weight:700;line-height:1;margin:8px 0 2px}
.rx .m{display:grid;grid-template-columns:18px 1fr;gap:0 2px;margin:5px 0;padding-bottom:4px;border-bottom:1px dotted #999}
.rx .m .nm i{font-size:.92em}
.rx .m .dz{display:flex;justify-content:space-between;gap:8px;font-size:.96em}
.rx .m .dz b{font-size:1.05em}
.rx .m .nt{font-size:.88em;opacity:.85}
.rx .fu{margin-top:8px;font-weight:700}
.rx .nt2{margin-top:4px}
.rx .sg{display:block;text-align:right;margin-top:8px}
.rx .sg img{display:block;margin-left:auto;max-height:54px;max-width:70%;object-fit:contain}

  const mk=(serial,name,age,g,phone,pid,type,fee,paid,status)=>({id:uid(),date:t,serial,pid,name,age,months:'',gender:g,phone,type,fee,paid,status,rx:newRx()});
  const s={settings:{doctor:'ডা. আপনার নাম',degree:'এমবিবিএস (ঢাকা), বিসিএস (স্বাস্থ্য)',spec:'মেডিসিন ও জেনারেল ফিজিশিয়ান',reg:'বিএমডিসি রেজি: ০০০০০',chamber:'আপনার চেম্বারের নাম',address:'ঠিকানা, শহর',hours:'রোগী দেখার সময়: সন্ধ্যা ৫টা – রাত ৯টা (শুক্রবার বন্ধ)',phone:'০১৭XXXXXXXX',paper:'80',fee:500},
    patients:[],appts:[],meds:[],templates:[],sug:{},counter:10252,onBreak:false,sample:true};
  const pts=[['রাব্বি (নমুনা)','Male',30,'01737541930'],['আদিয়াত (নমুনা)','Female',6,'01756566566'],['সুমি আক্তার (নমুনা)','Female',34,'01811223344']];
  pts.forEach((p,i)=>{const id=String(10250+i);s.patients.push({id,name:p[0],gender:p[1],age:p[2],phone:p[3]});
    s.appts.push(mk(i+1,p[0],p[2],p[1],p[3],id,i===1?'Old':'New',500,i===0,i===0?'in':'appointed'))});
  return s;
}
function newRx(){return{cc:[],oe:[],ph:[],dh:[],inv:[],dx:[],tp:[],op:[],adv:[],meds:[],fu:{n:'',u:'সপ্তাহ'},note:''}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);return Object.assign(defState(),o)}}catch(e){}return defState()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('ডেটা সংরক্ষণ করা যায়নি')}}
const allMeds=()=>[...S.meds,...MEDS_BUILTIN];
const getAppt=id=>S.appts.find(a=>a.id===id);
const getPt=id=>S.patients.find(p=>p.id===id);

/* ================= view state ================= */
const V={tab:'appt',date:todayISO(),q:'',pq:'',mq:'',rxId:null,previewId:null,paper:null};
const TABS=[['appt','অ্যাপয়েন্টমেন্ট'],['pat','রোগী'],['med','ওষুধ'],['set','সেটিংস']];

function render(){
  $('#hdTitle').textContent=S.settings.chamber||'চেম্বার';
  $('#hdDate').textContent=S.settings.doctor;
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${V.tab===k?'on':''}" data-act="tab" data-v="${k}">${l}</button>`).join('');
  $('#main').innerHTML={appt:vAppt,pat:vPat,med:vMed,set:vSet}[V.tab]();
}

/* ================= appointments tab ================= */
function dayAppts(){return S.appts.filter(a=>a.date===V.date).sort((a,b)=>a.serial-b.serial)}

  const done=l.filter(a=>a.status==='done').length,wait=l.filter(a=>a.status==='appointed'||a.status==='in').length;
  const coll=l.filter(a=>a.paid).reduce((s,a)=>s+(+a.fee||0),0);
  const cur=l.find(a=>a.status==='in');
  return `${S.sample?`<div class="card" style="border-color:var(--warn)"><b>নমুনা ডেটা দেখানো হচ্ছে।</b> <span class="muted">নিজের কাজ শুরুর আগে "সেটিংস" থেকে নমুনা ডেটা মুছে ফেলুন।</span></div>`:''}
  ${S.onBreak?'<div class="banner">ব্রেক চলছে — নতুন রোগী ডাকা বন্ধ আছে</div>':''}

    <button class="btn pri" data-act="book">+ অ্যাপয়েন্টমেন্ট</button>

    <button class="btn ${S.onBreak?'warn':''}" data-act="break">${S.onBreak?'ব্রেক শেষ':'ব্রেক'}</button>
  </div>
  <div class="bar">
    <button class="btn" data-act="dprev">‹</button>
    <input type="date" id="dsel" value="${V.date}" data-in="date" style="width:auto">
    <button class="btn" data-act="dnext">›</button>
    <button class="btn" data-act="dtoday">আজ</button>
    <input id="qsearch" class="grow" placeholder="নাম / ফোন / আইডি / সিরিয়াল খুঁজুন" value="${esc(V.q)}" data-in="q" style="min-width:160px">
    <button class="btn" data-act="csv">ডাউনলোড (CSV)</button>
  </div>
  <div class="stats">
    <div class="stat"><b>${bn(l.length)}</b><span>মোট সিরিয়াল</span></div>
    <div class="stat"><b>${bn(wait)}</b><span>অপেক্ষমান</span></div>
    <div class="stat"><b>${bn(done)}</b><span>দেখা হয়েছে</span></div>
    <div class="stat"><b>৳${bn(coll)}</b><span>ফি আদায়</span></div>
  </div>
  ${cur?`<div class="muted" style="margin-bottom:6px">এখন ভিতরে: <b>সিরিয়াল ${bn(cur.serial)} — ${esc(cur.name)}</b></div>`:''}
  ${f.length?f.map(apptCard).join(''):`<div class="card muted">${l.length?'কোনো মিল পাওয়া যায়নি।':'এই তারিখে কোনো অ্যাপয়েন্টমেন্ট নেই। "+ অ্যাপয়েন্টমেন্ট" চেপে প্রথম রোগী যোগ করুন।'}</div>`}`;
}
function ageText(a,L){const d=L?(x=>x):bn;return [a.age?d(a.age)+' বছর':'',a.months?d(a.months)+' মাস':''].filter(Boolean).join(' ')||'বয়স নেই'}
function apptCard(a){

    <select data-in="status" data-id="${a.id}">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${a.status===k?'selected':''}>${v}</option>`).join('')}</select>

      <button class="btn sm ${a.paid?'go':''}" data-act="fee" data-id="${a.id}">${a.paid?'ফি ✓ ৳'+bn(a.fee):'ফি নিন ৳'+bn(a.fee)}</button>

/* ================= prescription editor ================= */
function curRx(){const a=getAppt(V.rxId);return a&&a.rx}
function openRx(id){V.rxId=id;const v=$('#view');v.classList.add('open');drawRx();v.scrollTop=0}
function closeView(){V.rxId=null;V.previewId=null;$('#view').classList.remove('open');$('#view').innerHTML='';render()}
function drawRx(){
  const a=getAppt(V.rxId),r=a.rx;
  const secH=k=>`<div class="sec"><h4>${SEC[k]} <button data-act="pick" data-k="${k}" aria-label="${SEC[k]} যোগ">+</button></h4>${r[k].length?`<ul>${r[k].map(i=>`<li>${esc(i.t)}${i.n?` <small>→ ${esc(i.n)}</small>`:''}</li>`).join('')}</ul>`:''}</div>`;
  $('#view').innerHTML=`<div class="wrap">
  <div class="vbar"><b>প্রেসক্রিপশন</b><div class="row"><button class="btn sm" data-act="tplmenu">টেমপ্লেট</button><button class="btn sm" data-act="repeat">আগের Rx কপি</button><button class="btn sm" data-act="closeview">← ফিরে যান</button></div></div>
  <div class="card"><div class="ptbox"><div><div class="pn">${esc(a.name)}</div><div class="meta">${ageText(a)} · ${a.gender==='Male'?'পুরুষ':a.gender==='Female'?'মহিলা':'অন্যান্য'}</div></div>

/* ===== PDF (লাইব্রেরি ছাড়াই, অফলাইনে কাজ করে) ===== */
function rxCSSText(){let t='';for(const ss of document.styleSheets){let rules;try{rules=ss.cssRules}catch(e){continue}for(const r of rules){if(r.selectorText&&r.selectorText.startsWith('.rx'))t+=r.cssText+'\n'}}return t}
function renderToCanvas(html,widthPx,scale){
  return new Promise((res,rej)=>{
    const host=document.createElement('div');host.style.cssText='position:fixed;left:-20000px;top:0;background:#fff';host.innerHTML=html;document.body.appendChild(host);
    const node=host.firstElementChild;const H=Math.ceil(node.getBoundingClientRect().height);
    const xml=new XMLSerializer().serializeToString(node);host.remove();
    const font="'Hind Siliguri','Noto Sans Bengali','Kalpurush','SolaimanLipi',sans-serif";
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${widthPx*scale}" height="${H*scale}" viewBox="0 0 ${widthPx} ${H}"><foreignObject x="0" y="0" width="${widthPx}" height="${H}"><div xmlns="http://www.w3.org/1999/xhtml" style="--font:${font};font-family:${font};background:#fff"><style>${rxCSSText().replace(/</g,'&lt;')}</style>${xml}</div></foreignObject></svg>`;
    const img=new Image();
    img.onload=()=>{try{const c=document.createElement('canvas');c.width=widthPx*scale;c.height=H*scale;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0);c.toDataURL('image/jpeg');res(c)}catch(e){rej(e)}};
    img.onerror=()=>rej(new Error('render'));
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}
function jpgBytes(c){const b=atob(c.toDataURL('image/jpeg',.93).split(',')[1]);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function buildPDF(pages){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(id,fn)=>{offs[id]=len;push(id+' 0 obj\n');fn();push('endobj\n')};
  const n=pages.length,f=v=>v.toFixed(2);
  push('%PDF-1.4\n');
  obj(1,()=>push('<</Type/Catalog/Pages 2 0 R>>\n'));
  obj(2,()=>push(`<</Type/Pages/Kids [${pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')}]/Count ${n}>>\n`));
  pages.forEach((p,i)=>{const id=3+3*i;
    obj(id,()=>push(`<</Type/Page/Parent 2 0 R/MediaBox [0 0 ${f(p.w)} ${f(p.h)}]/Resources<</XObject<</Im0 ${id+2} 0 R>>>>/Contents ${id+1} 0 R>>\n`));
    const c=`q ${f(p.w)} 0 0 ${f(p.ih)} 0 ${f(p.h-p.ih)} cm /Im0 Do Q`;
    obj(id+1,()=>push(`<</Length ${c.length}>>\nstream\n${c}\nendstream\n`));
    obj(id+2,()=>{push(`<</Type/XObject/Subtype/Image/Width ${p.px}/Height ${p.py}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${p.jpg.length}>>\nstream\n`);push(p.jpg);push('\nendstream\n')});
  });
  const xr=len,tot=3+3*n;
  push(`xref\n0 ${tot}\n0000000000 65535 f \n`);for(let i=1;i<tot;i++)push(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  push(`trailer\n<</Size ${tot}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
function pdfDownload(){const p=window._pdf;if(!p)return;const el=document.createElement('a');el.href=p.url;el.download=p.name;document.body.appendChild(el);el.click();el.remove()}
function pdfDialog(){
  const p=window._pdf,canShare=!!(navigator.canShare&&navigator.share&&navigator.canShare({files:[new File([p.blob],p.name,{type:'application/pdf'})]}));

async function makePDF(a,paper){
  toast('PDF তৈরি হচ্ছে…');
  try{
    const a4=paper==='a4',wPx=a4?794:paper==='58'?210:302,sc=a4?2:3;
    const c=await renderToCanvas(rxHTML(a,paper),wPx,sc);
    let pages=[];
    if(a4){
      const W=595.28,H=841.89,pagePx=Math.floor(c.width*H/W);
      for(let y=0;y<c.height;y+=pagePx){const hh=Math.min(pagePx,c.height-y);const s=document.createElement('canvas');s.width=c.width;s.height=hh;const g=s.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,s.width,hh);g.drawImage(c,0,y,c.width,hh,0,0,c.width,hh);
        pages.push({w:W,h:H,ih:hh*W/c.width,px:c.width,py:hh,jpg:jpgBytes(s)})}
    }else{
      const W=(paper==='58'?58:80)*2.8346,Hh=c.height*W/c.width;
      pages=[{w:W,h:Hh,ih:Hh,px:c.width,py:c.height,jpg:jpgBytes(c)}];
    }
    const blob=buildPDF(pages),name='Rx_'+a.pid+'_'+a.date+'.pdf';
    window._pdf={blob,name,url:URL.createObjectURL(blob),imgs:pages.map(p=>URL.createObjectURL(new Blob([p.jpg],{type:'image/jpeg'})))};
    pdfDialog();
    pdfDownload();
  }catch(e){
    toast('সরাসরি PDF হয়নি — প্রিন্ট ডায়ালগে "Save as PDF" বেছে নিন');doPrint(rxHTML(a,paper),paper==='a4'?'a4':paper);
  }
}

async function pwaCheck(){
  const w=window._pwa;w.https=location.protocol==='https:'||location.hostname==='localhost';
  w.sw=!!(navigator.serviceWorker&&navigator.serviceWorker.controller)||!!(navigator.serviceWorker&&await navigator.serviceWorker.getRegistration().catch(()=>null));
  try{const r=await fetch('manifest.json',{cache:'no-store'});w.manifest=r.ok&&(await r.json()).icons.length>0}catch(e){w.manifest=false}
  if(!w.manifest&&document.querySelector('link[rel=manifest][href^=blob]'))w.manifest=true;
  const img=u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i.naturalWidth);i.onerror=()=>r(0);i.src=u+'?'+Date.now()});
  w.i192=(await img('icon-192.png'))===192;w.i512=(await img('icon-512.png'))===512;
  try{const reg=await navigator.serviceWorker.getRegistration();w.swState=reg?(reg.active?'চালু':reg.installing?'ইন্সটল হচ্ছে':'অপেক্ষায়'):'নেই'}catch(e){w.swState='নেই'}
  w.link=!!document.querySelector('link[rel=manifest]');
  w.incog=false;try{const est=await navigator.storage.estimate();w.incog=est.quota<120*1024*1024}catch(e){}
  w.standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if(V.tab==='set')render();
}

function initSig(){
  const c=$('#sigcv'),r=c.getBoundingClientRect();c.width=Math.round(r.width*2);c.height=Math.round(r.height*2);
  const g=c.getContext('2d');g.lineWidth=5;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#111';
  let down=false;const pt=e=>{const b=c.getBoundingClientRect();return[(e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height]};
  c.onpointerdown=e=>{down=true;c._ink=true;c.setPointerCapture(e.pointerId);const[x,y]=pt(e);g.beginPath();g.moveTo(x,y);g.lineTo(x+.1,y+.1);g.stroke()};
  c.onpointermove=e=>{if(!down)return;const[x,y]=pt(e);g.lineTo(x,y);g.stroke()};
  c.onpointerup=c.onpointercancel=()=>{down=false};
}
function trimCanvas(c){const g=c.getContext('2d'),d=g.getImageData(0,0,c.width,c.height).data;let x0=c.width,y0=c.height,x1=0,y1=0;
  for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){if(d[(y*c.width+x)*4+3]>10){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
  const p=8;x0=Math.max(0,x0-p);y0=Math.max(0,y0-p);x1=Math.min(c.width,x1+p);y1=Math.min(c.height,y1+p);
  const o=document.createElement('canvas');o.width=x1-x0;o.height=y1-y0;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);return o.toDataURL('image/png')}
$('#sigIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();

    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
    /* সাদা পটভূমি স্বচ্ছ করে, কালচে অংশ রাখে */
    const id=g.getImageData(0,0,c.width,c.height),d=id.data;for(let i=0;i<d.length;i+=4){const l=(d[i]+d[i+1]+d[i+2])/3;const a=l>200?0:Math.min(255,(200-l)*2.2);d[i]=d[i+1]=d[i+2]=Math.min(d[i],40);d[i+3]=a}

   <button class="btn" data-act="close">বন্ধ</button>`)},

 clearsample(b){twoTap(b,'নিশ্চিত? নমুনা মুছবে',()=>{S.appts=S.appts.filter(a=>!a.name.includes('(নমুনা)'));S.patients=S.patients.filter(p=>!p.name.includes('(নমুনা)'));S.sample=false;save();render();toast('নমুনা ডেটা মুছে গেছে')})}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(b&&ACT[b.dataset.act]){ACT[b.dataset.act](b,e);return}
  if(e.target.id==='modal'){ACT.closepick()}
});
const INP={
 date(e){V.date=e.target.value||todayISO();render()},
 q(e){V.q=e.target.value;const p=e.target.selectionStart;render();const i=$('#qsearch');i.focus();i.setSelectionRange(p,p)},
 pq(e){V.pq=e.target.value;const p=e.target.selectionStart;render();const i=$('#pqs');i.focus();i.setSelectionRange(p,p)},
 mq(e){V.mq=e.target.value;const p=e.target.selectionStart;render();const i=$('#mqs');i.focus();i.setSelectionRange(p,p)},
 status(e){const a=getAppt(e.target.dataset.id);a.status=e.target.value;save();render()},
 set(e){const k=e.target.dataset.k;S.settings[k]=k==='fee'?(+e.target.value||0):e.target.value;save();$('#hdTitle').textContent=S.settings.chamber||'চেম্বার';$('#hdDate').textContent=S.settings.doctor},
 pq2(e){P.q=e.target.value;drawPick()},
 pnote(e){curRx()[P.k][+e.target.dataset.i].n=e.target.value;save()},
 mq2(e){MQ=e.target.value;drawMedRes()},
 me(e){const m=curRx().meds[ME];m[e.target.dataset.k]=e.target.value;save()},
 fun(e){curRx().fu.n=e.target.value;save()},
 fuu(e){curRx().fu.u=e.target.value;save()},
 sigshow(e){S.settings.sigShow=e.target.checked;save()},
 rxnote(e){curRx().note=e.target.value;save()},
 paper(e){V.paper=e.target.value;drawPreview()}
};
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(k&&INP[k]&&e.target.tagName!=='SELECT'&&e.target.type!=='checkbox')INP[k](e)});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.in;if(k&&INP[k]&&(e.target.tagName==='SELECT'||e.target.type==='date'||e.target.type==='checkbox'))INP[k](e)});
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.settings||!o.appts)throw 0;S=Object.assign(defState(),o);save();render();toast('ব্যাকআপ লোড হয়েছে')}catch(x){toast('ফাইলটি সঠিক ব্যাকআপ নয়')}};r.readAsText(f);e.target.value=''});
render();
